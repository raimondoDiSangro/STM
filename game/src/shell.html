<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SuperTeleMurgia: La Leggenda dello Sciacquone</title>
<meta name="description" content="Avventura punta-e-clicca volgare e kitsch nella Murgia: Sciacquone il Pagliaccione contro il Clan dei Pallonari. Gioca gratis nel browser.">
<meta name="theme-color" content="#120c18">
<!--SITE-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700&family=Eczar:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: vulgar, loud, affectionate satire of the Murgia
   IDEA: a LucasArts-style cut-paper adventure inside a lacquered arcade cabinet
   PICTURE: the game canvas fills the screen, letterboxed in deep plum
   COLOUR and TYPE: tufa ochre, luminarie gold, plum night; Eczar + Alegreya Sans
   LAYOUT: one 16:9 stage, centered, scaled to any window */
html,body{margin:0;height:100%;background:#120c18;overflow:hidden;color-scheme:dark;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#2a1a2e 0%,#120c18 70%)}
canvas{display:block;cursor:crosshair;touch-action:none;box-shadow:0 0 60px rgba(0,0,0,.6);image-rendering:auto}
#rotate{display:none;position:fixed;inset:0;z-index:5;background:#120c18;color:#ffe2a6;font:800 22px "Alegreya Sans","Fira Sans",sans-serif;text-align:center;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:24px}
#rotate span{font-size:64px;line-height:1;display:inline-block;animation:spin 2.4s ease-in-out infinite}
@keyframes spin{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:820px){#rotate{display:flex}}
#hint{position:fixed;bottom:6px;left:0;right:0;text-align:center;font:600 12px "Alegreya Sans",sans-serif;color:rgba(255,230,200,.35);pointer-events:none}
@media (prefers-reduced-motion:reduce){canvas{box-shadow:none}}
</style>
</head>
<body>
<div id="rotate"><span>&#9647;</span>Gira il telefono in orizzontale<br>per giocare a SuperTeleMurgia</div>
<div id="wrap"><canvas id="game" width="1280" height="720" aria-label="SuperTeleMurgia, gioco d'avventura punta e clicca"></canvas></div>
<script>
/*__GAME__*/
</script>
</body>
</html>
