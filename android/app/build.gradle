plugins {
    id 'com.android.application'
}

// Release signing comes from environment variables (GitHub Actions secrets)
// or from android/keystore.properties on your own computer. Never commit either.
def keyProps = new Properties()
def keyFile = rootProject.file('keystore.properties')
if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }
def sign = { String env, String prop -> System.getenv(env) ?: keyProps.getProperty(prop) }
def storePath = sign('STM_KEYSTORE', 'storeFile')

android {
    namespace 'com.supertelemurgia.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.supertelemurgia.game'
        minSdk 24
        targetSdk 36
        // every upload to Google Play needs a bigger versionCode; CI passes the run number
        versionCode((System.getenv('STM_VERSION_CODE') ?: '1').toInteger())
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (storePath) {
                storeFile file(storePath)
                storePassword sign('STM_KEYSTORE_PASSWORD', 'storePassword')
                keyAlias sign('STM_KEY_ALIAS', 'keyAlias')
                keyPassword sign('STM_KEY_PASSWORD', 'keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (storePath) signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // the game itself is generated by `python game/build.py`
    androidResources {
        noCompress += ['html', 'ttf']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

tasks.register('checkGameAssets') {
    doLast {
        if (!file('src/main/assets/game/index.html').exists())
            throw new GradleException('Game not built yet: run `python game/build.py` from the repository root first.')
    }
}
preBuild.dependsOn 'checkGameAssets'
