# Publishes a playable version of the game on GitHub Pages
# (https://<your-user>.github.io/<repo>/) every time you push to main.
#
# Which version goes online is set by PAGES_VERSION below:
#   demo -> free demo, ends after Act I (keeps the full game for sale)
#   web  -> the full game, free for everyone
#
# One-time setup on GitHub: Settings -> Pages -> Source: "GitHub Actions".
name: Publish playable game

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PAGES_VERSION: demo

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the game
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          export SITE_URL="https://${OWNER}.github.io/${REPO}"
          python game/build.py
      - name: Pick the version to publish
        run: |
          mkdir -p site
          cp dist/${PAGES_VERSION}/index.html site/index.html
          cp web/* site/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
