# Builds the Android version on every push (and on demand).
#
# Outputs, under the run's "Artifacts":
#   SuperTeleMurgia-android-test   app-debug.apk  -> install it on your phone to try the game
#   SuperTeleMurgia-android-play   app-release.aab -> upload this to Google Play Console
#
# The .aab is signed with your upload key when these 4 repository secrets exist
# (Settings -> Secrets and variables -> Actions), see android/make-upload-key.sh:
#   STM_KEYSTORE_BASE64, STM_KEYSTORE_PASSWORD, STM_KEY_ALIAS, STM_KEY_PASSWORD
name: Android

on:
  push:
    branches: [main]
    paths: ['game/**', 'android/**', 'desktop/game/fonts/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.STM_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the game page
        run: python game/build.py

      - name: Touch test (emulated phone)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python tests/touch.py

      - name: Unpack the upload key
        if: env.HAS_KEY == 'true'
        env:
          KS: ${{ secrets.STM_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "STM_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build APK and App Bundle
        working-directory: android
        env:
          STM_VERSION_CODE: ${{ github.run_number }}
          STM_KEYSTORE_PASSWORD: ${{ secrets.STM_KEYSTORE_PASSWORD }}
          STM_KEY_ALIAS: ${{ secrets.STM_KEY_ALIAS }}
          STM_KEY_PASSWORD: ${{ secrets.STM_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: SuperTeleMurgia-android-test
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SuperTeleMurgia-android-play
          path: android/app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touch-screenshots
          path: tests/shots/
